name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Os testes de integração sobem Postgres, Kafka, RabbitMQ, Redis e Elasticsearch REAIS via Testcontainers
      # (o runner ubuntu já tem Docker) e geram as próprias chaves JWT: não há serviço nem variável a configurar aqui.
      - name: Build e testes (todos os módulos)
        run: ./gradlew build --no-daemon

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: "**/build/reports/tests/test"
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # push: false — só prova que a imagem builda (o mesmo critério dos serviços Java).
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  docker-images:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-service
          - search-service
          - storage-service
          - notification-service
          - chatbot-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false — só prova que a imagem builda. Publicar num registry é o CD, que fica pra quando houver cluster.
      - name: Build da imagem ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SERVICE_MODULE=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
