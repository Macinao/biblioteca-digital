spring:
  application:
    name: biblioteca

  jpa:
    hibernate:
      ddl-auto: update

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${AI_MODEL:llama-3.3-70b-versatile}
          temperature: 0.3

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  keys:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:3600000}

  supabase:
    url: ${SUPABASE_URL}
    key: ${SUPABASE_KEY}

  evolution:
    url: ${EVOLUTION_URL:http://localhost:8081}
    apikey: ${EVOLUTION_APIKEY}
    instance: ${EVOLUTION_INSTANCE:Biblioteca}

  security:
    cookie:
      secure: false
      same-site: Lax
      domain:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
