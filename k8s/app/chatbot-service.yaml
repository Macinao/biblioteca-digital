apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: portifolio00-chatbot-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8094
          env:
            - name: REDIS_HOST
              value: redis-chatbot
            - name: REDIS_PORT
              value: "6379"
            - name: AI_API_KEY
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: AI_API_KEY } }
            - name: AI_BASE_URL
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: AI_BASE_URL } }
            - name: AI_MODEL
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: AI_MODEL } }
            - name: SEARCH_SERVICE_URL
              value: "http://search-service:8091"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8094 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8094 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: smartteca
spec:
  selector:
    app: chatbot-service
  ports:
    - port: 8094
      targetPort: 8094
