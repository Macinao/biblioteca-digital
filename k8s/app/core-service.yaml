apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          # Imagem construida local (Dockerfile na raiz) e carregada no
          # cluster via "kind load docker-image" — sem registry, por isso
          # o pull policy tem que ser Never (nunca tenta baixar).
          image: portifolio00-core-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres-core:5432/smartteca"
            - name: DB_USERNAME
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: DB_PASSWORD } }
            - name: JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: JWT_PRIVATE_KEY } }
            - name: JWT_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: JWT_PUBLIC_KEY } }
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.smartteca.svc.cluster.local:9092"
            - name: RABBITMQ_HOST
              value: rabbitmq
            # Precisa ser explicito: o K8s injeta sozinho um RABBITMQ_PORT
            # (formato Docker-links, "tcp://<cluster-ip>:5672") pra todo pod,
            # so por existir um Service chamado "rabbitmq" — sem isto aqui
            # pra sobrescrever, o Spring tenta fazer bind desse valor num
            # Integer e a aplicacao nem sobe.
            - name: RABBITMQ_PORT
              value: "5672"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8090 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: smartteca
spec:
  # Sem tipo LoadBalancer/NodePort: so alcancavel de dentro do cluster,
  # igual ao "sem ports" do compose (Fase 6, isolamento de rede).
  selector:
    app: core-service
  ports:
    - port: 8090
      targetPort: 8090
