apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: portifolio00-notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8093
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: RABBITMQ_PASSWORD } }
            - name: EVOLUTION_URL
              value: "http://evolution:8080"
            - name: EVOLUTION_APIKEY
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: EVOLUTION_APIKEY } }
            - name: EVOLUTION_INSTANCE
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: EVOLUTION_INSTANCE } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8093 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8093 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smartteca
spec:
  selector:
    app: notification-service
  ports:
    - port: 8093
      targetPort: 8093
