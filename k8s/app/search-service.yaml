apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: portifolio00-search-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8091
          env:
            - name: ELASTICSEARCH_URIS
              value: "http://elasticsearch:9200"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.smartteca.svc.cluster.local:9092"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8091 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8091 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: smartteca
spec:
  selector:
    app: search-service
  ports:
    - port: 8091
      targetPort: 8091
