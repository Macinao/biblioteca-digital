apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
        - name: storage-service
          image: portifolio00-storage-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8092
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            # Precisa ser explicito: o K8s injeta sozinho um RABBITMQ_PORT
            # (formato Docker-links) pra todo pod so por existir um Service
            # chamado "rabbitmq" — sem isto pra sobrescrever, quebra o bind
            # do Spring (esperava um numero, recebe "tcp://<ip>:5672").
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: RABBITMQ_PASSWORD } }
            - name: SUPABASE_URL
              valueFrom: { configMapKeyRef: { name: smartteca-config, key: SUPABASE_URL } }
            - name: SUPABASE_KEY
              valueFrom: { secretKeyRef: { name: smartteca-secrets, key: SUPABASE_KEY } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8092 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8092 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: smartteca
spec:
  selector:
    app: storage-service
  ports:
    - port: 8092
      targetPort: 8092
