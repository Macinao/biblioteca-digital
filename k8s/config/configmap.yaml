apiVersion: v1
kind: ConfigMap
metadata:
  name: smartteca-config
  namespace: smartteca
data:
  DB_USERNAME: smartteca
  RABBITMQ_USERNAME: guest
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  # Ollama roda no host, fora do cluster — host.docker.internal resolve o
  # host por tras do Docker Desktop, o mesmo endereco usado no compose.
  AI_BASE_URL: http://host.docker.internal:11434/v1
  AI_MODEL: "qwen3:8b"
  EVOLUTION_INSTANCE: Biblioteca
  SUPABASE_URL: ""
