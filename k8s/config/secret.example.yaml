# Copie para secret.yaml (gitignored) e preencha com valores reais — mesmo
# padrao do .env/.env.example na raiz do projeto. "stringData" aceita texto
# puro; o Kubernetes cuida do base64 internamente.
apiVersion: v1
kind: Secret
metadata:
  name: smartteca-secrets
  namespace: smartteca
type: Opaque
stringData:
  DB_PASSWORD: smartteca
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  RABBITMQ_PASSWORD: guest
  EVOLUTION_DB_PASSWORD: "123456"
  EVOLUTION_APIKEY: "123456"
  SUPABASE_KEY: ""
  AI_API_KEY: ollama
  GRAFANA_ADMIN_PASSWORD: admin
