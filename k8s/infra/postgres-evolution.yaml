apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-evolution
  namespace: smartteca
spec:
  serviceName: postgres-evolution
  replicas: 1
  selector:
    matchLabels:
      app: postgres-evolution
  template:
    metadata:
      labels:
        app: postgres-evolution
    spec:
      containers:
        - name: postgres-evolution
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: evolution
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: smartteca-secrets, key: EVOLUTION_DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "evolution"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-evolution
  namespace: smartteca
spec:
  selector:
    app: postgres-evolution
  ports:
    - port: 5432
      targetPort: 5432
