apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-chatbot
  namespace: smartteca
spec:
  serviceName: redis-chatbot
  replicas: 1
  selector:
    matchLabels:
      app: redis-chatbot
  template:
    metadata:
      labels:
        app: redis-chatbot
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-chatbot
  namespace: smartteca
spec:
  selector:
    app: redis-chatbot
  ports:
    - port: 6379
      targetPort: 6379
---
