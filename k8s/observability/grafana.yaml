# Os ConfigMaps grafana-datasources e grafana-dashboards-provider e
# grafana-dashboards NAO estao aqui — sao gerados a partir dos mesmos
# arquivos que o docker-compose ja usa (observability/grafana/...), via
# "kubectl create configmap --from-file" no deploy.sh/deploy.ps1. Evita
# manter o dashboard/provisionamento duplicado em dois formatos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: smartteca-secrets, key: GRAFANA_ADMIN_PASSWORD }
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: smartteca
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: smartteca
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
