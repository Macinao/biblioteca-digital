apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smartteca
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:

      - job_name: core-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["core-service:8090"]

      - job_name: search-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["search-service:8091"]

      - job_name: storage-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["storage-service:8092"]

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["notification-service:8093"]

      - job_name: chatbot-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["chatbot-service:8094"]

      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["api-gateway:8080"]

      - job_name: rabbitmq
        metrics_path: /metrics
        static_configs:
          - targets: ["rabbitmq:15692"]

      - job_name: kafka-exporter
        static_configs:
          - targets: ["kafka-exporter:9308"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: smartteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: smartteca
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: smartteca
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
